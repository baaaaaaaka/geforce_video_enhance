name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 5
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 5.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build release package
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawVersion = "${{ inputs.version }}"
            $tag = "v$rawVersion"
          } else {
            $tag = "${{ github.ref_name }}"
            $rawVersion = $tag.TrimStart("v")
          }

          $packageVersion = $rawVersion -replace "-.*$", ""
          $isPrerelease = $rawVersion -match "-"
          $repoVersion = (Get-Content -Raw VERSION).Trim()
          if ($repoVersion -ne $packageVersion) {
            throw "Tag/input version $rawVersion resolves to package version $packageVersion, but VERSION is $repoVersion"
          }

          .\scripts\package-release.ps1 -Version $packageVersion

          @(
            "# $tag",
            "",
            "See CHANGELOG.md for release notes.",
            "",
            "The Windows x64 package contains the unpacked extension, native messaging host, Smooth Motion presenter, and installer scripts."
          ) | Set-Content -LiteralPath release-notes.md -Encoding UTF8

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/release/geforce-video-enhance-$env:RELEASE_VERSION-win-x64.zip"
          $args = @(
            "release",
            "create",
            $env:RELEASE_TAG,
            $zip,
            "--title",
            $env:RELEASE_TAG,
            "--notes-file",
            "release-notes.md",
            "--verify-tag"
          )
          if ($env:RELEASE_PRERELEASE -eq "true") {
            $args += "--prerelease"
          } else {
            $args += "--latest"
          }

          & gh @args
